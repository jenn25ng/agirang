  <style>
/* =========================================================================
 *  아기랑 – 스타일 (모바일 우선 · 큰 터치 영역 · 아기자기한 파스텔)
 * ========================================================================= */
:root {
  --bg: #fff4e6;
  --bg2: #ffe8cc;
  --ink: #4a3b2f;
  --ink-soft: #8a7663;
  --card: #ffffff;
  --shadow: 0 8px 22px rgba(120, 90, 60, 0.14);
  --radius: 22px;
  --font-round: "Jua", "Noto Sans KR", sans-serif;
  --font-body: "Noto Sans KR", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(1200px 500px at 50% -10%, #fff 0%, transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  background-attachment: fixed;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
  -webkit-tap-highlight-color: transparent;
}

/* ---------------------------------------------------------------- 헤더 */
.app-header {
  text-align: center;
  padding: 22px 16px 10px;
}
.logo {
  font-family: var(--font-round);
  font-size: 2rem;
  margin: 0;
  color: var(--ink);
  letter-spacing: 0.5px;
}
.subtitle {
  margin: 6px 0 0;
  color: var(--ink-soft);
  font-size: 0.95rem;
}

/* ---------------------------------------------------------------- 뷰 공통 */
.view { max-width: 900px; margin: 0 auto; padding: 8px 16px 40px; }
.hidden { display: none !important; }

.home-hint {
  font-family: var(--font-round);
  text-align: center;
  font-size: 1.1rem;
  margin: 6px 0 18px;
  color: var(--ink);
}

/* ---------------------------------------------------------------- 홈 그리드 */
.show-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
@media (min-width: 620px) {
  .show-grid { grid-template-columns: repeat(3, 1fr); }
}

.show-card {
  --card-color: #ff8fab;
  position: relative;
  border: none;
  cursor: pointer;
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px 14px 16px;
  box-shadow: var(--shadow);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  overflow: hidden;
  transition: transform 0.14s ease, box-shadow 0.14s ease;
  font-family: var(--font-body);
}
.show-card::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 8px;
  background: var(--card-color);
}
.show-card:active { transform: scale(0.96); }
.show-card:hover { box-shadow: 0 12px 28px rgba(120, 90, 60, 0.22); }

.show-emoji {
  font-size: 3rem;
  line-height: 1;
  margin-top: 6px;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,0.12));
}
.show-name {
  font-family: var(--font-round);
  font-size: 1.25rem;
  color: var(--ink);
  margin-top: 6px;
}
.show-sub { font-size: 0.78rem; color: var(--ink-soft); }
.show-tagline {
  font-size: 0.8rem;
  color: var(--ink-soft);
  margin-top: 4px;
  min-height: 2.2em;
  line-height: 1.35;
}
.show-badges { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
.badge {
  font-size: 0.68rem;
  background: var(--bg2);
  color: var(--ink);
  border-radius: 999px;
  padding: 2px 9px;
  font-weight: 700;
}

.disclaimer {
  margin-top: 26px;
  font-size: 0.75rem;
  color: var(--ink-soft);
  text-align: center;
  line-height: 1.6;
  background: rgba(255,255,255,0.55);
  border-radius: 16px;
  padding: 12px 14px;
}

/* ---------------------------------------------------------------- 상세 */
.detail-top { margin-bottom: 16px; }
.back-btn {
  border: none;
  background: #fff;

    show: null, // 선택한 프로그램
    lang: "ko", // 현재 언어
    player: null, // 재생 중 정보 { season, listId, index, baseTitle }
  };

  const langLabel = { ko: "한국어", en: "English" };

  /* ---------------------------------------------------------------- 화면 전환 */
  function show(viewName) {
    Object.values(views).forEach((v) => v.classList.add("hidden"));
    views[viewName].classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }

  /* ---------------------------------------------------------------- 유틸 */
  // 특정 언어로 볼 수 있는지 (채널이 있으면 가능)
  function hasLang(showObj, lang) {
    return showObj.langs.includes(lang) && !!showObj.channels[lang];
  }

  // 프로그램의 기본 언어(한국어 우선, 없으면 첫 지원 언어)
  function defaultLang(showObj) {
    return showObj.langs.includes("ko") ? "ko" : showObj.langs[0];
  }

  // 유튜브 검색 URL (재생목록 ID가 없을 때의 안전한 대체 링크)
  function youtubeSearch(showObj, season, lang) {
    const name = showObj.title[lang] || showObj.title.en || showObj.title.ko;
    const seasonWord = lang === "ko" ? "전체 에피소드" : "full episodes";
    const q = `${name} ${season.title[lang] || ""} ${seasonWord}`.trim();
    return "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
  }

  /* ---------------------------------------------------------------- 홈 렌더 */
  function renderHome() {
    const grid = $("#showGrid");
    grid.innerHTML = "";

    SHOWS.forEach((s) => {
      const card = document.createElement("button");
      card.className = "show-card";
      card.style.setProperty("--card-color", s.color);
      card.setAttribute("aria-label", s.title.ko);

      const langBadges = s.langs
        .map((l) => `<span class="badge">${l === "ko" ? "한국어" : "영어"}</span>`)
        .join("");

      card.innerHTML = `
        <div class="show-emoji">${s.emoji}</div>
        <div class="show-name">${s.title.ko}</div>
        <div class="show-sub">${s.title.en}</div>
        <div class="show-tagline">${s.tagline.ko}</div>
        <div class="show-badges">${langBadges}</div>
      `;
      card.addEventListener("click", () => openShow(s));
      grid.appendChild(card);
    });
  }

  /* ---------------------------------------------------------------- 상세 렌더 */
  function openShow(showObj) {
    state.show = showObj;
    state.lang = defaultLang(showObj);
    renderDetail();
    show("detail");
  }

  function renderDetail() {
    const s = state.show;
    $("#detailEmoji").textContent = s.emoji;
    $("#detailTitle").textContent = `${s.title.ko} · ${s.title.en}`;
    $("#detailTagline").textContent = s.tagline.ko;

    // 언어 토글 (지원 언어가 2개 이상일 때만)
    const toggle = $("#langToggle");
    toggle.innerHTML = "";
    if (s.langs.length > 1) {
      s.langs.forEach((l) => {
        const btn = document.createElement("button");
        btn.className = "lang-btn" + (l === state.lang ? " active" : "");
        btn.textContent = langLabel[l];
        btn.addEventListener("click", () => {
          state.lang = l;
          renderDetail();
        });
        toggle.appendChild(btn);
      });
    }

    renderSeasons();
  }

  function renderSeasons() {
    const s = state.show;
    const lang = state.lang;
    const listEl = $("#seasonList");
    listEl.innerHTML = "";

    s.seasons.forEach((season) => {
      // 시즌에 langs가 지정돼 있으면 해당 언어에서만 노출
      // (예: 넘버블록스 – 영어는 시즌별, 한국어는 '전체 에피소드' 통합)
      if (season.langs && !season.langs.includes(lang)) return;
      const hasList = !!((season.list && season.list[lang]) || (season.videos && season.videos.length));
      const row = document.createElement("button");
      row.className = "season-row" + (hasList ? "" : " season-row--fallback");
      row.style.setProperty("--card-color", s.color);

      const label = hasList
        ? `<span class="season-play">▶</span>`
        : `<span class="season-play season-play--ext">↗</span>`;

      const note = hasList
        ? `<span class="season-note">앱에서 순서대로 재생</span>`
        : `<span class="season-note">유튜브 공식 채널에서 보기</span>`;

      row.innerHTML = `
        ${label}
        <span class="season-text">
          <span class="season-title">${season.title[lang] || season.title.ko}</span>
          ${note}
        </span>
      `;

      row.addEventListener("click", () => {
        if (hasList) {
          openPlayer(season);
        } else {
          // 재생목록 ID가 없으면 공식 채널 또는 검색으로 이동
          const url = s.channels[lang] || youtubeSearch(s, season, lang);
          window.open(url, "_blank", "noopener");
        }
      });
      listEl.appendChild(row);
    });
  }

  /* ---------------------------------------------------------------- 플레이어 (YouTube IFrame API)
   * 주의: /embed/videoseries 는 &index= 를 무시하고,
   *       기존 플레이어에 cuePlaylist 를 다시 호출해도 "다른 재생목록"으로는 전환되지 않는다.
   *       그래서 (1) 프로그램/시즌을 열 때마다 플레이어를 새로 만들고(첫 cuePlaylist 는 정상 = 포스터),
   *              (2) 같은 재생목록 안에서 화 이동은 loadPlaylist({index}) 로 처리(정상 동작).
   */
  let ytPlayer = null; // 현재 YT.Player 인스턴스
  let ytApiLoaded = false; // IFrame API 로드 완료 여부

  (function loadYouTubeApi() {
    if (window.YT && window.YT.Player) {
      ytApiLoaded = true;
      return;
    }
    window.onYouTubeIframeAPIReady = () => {
      ytApiLoaded = true;
      if (state.player) createPlayerFor(state.player); // 준비 전에 열었으면 이때 생성
    };
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  })();

  function openPlayer(season, startIndex) {
    const s = state.show;
    const lang = state.lang;
    const listId = season.list ? season.list[lang] : null;
    const videos = season.videos || null; // 최애 모음처럼 특정 영상 배열
    const idx = startIndex || 1;

    state.player = {
      season,
      listId,
      videos,
      index: idx,
      baseTitle: `${s.title[lang] || s.title.ko} – ${season.title[lang] || season.title.ko}`,
    };

    $("#epStrip").style.setProperty("--card-color", s.color);
    $("#playerTitle").textContent = state.player.baseTitle + (idx > 1 ? ` · ${idx}화` : "");
    updateOpenYoutube();
    renderEpisodeStrip(season, idx);
    createPlayerFor(state.player);

    show("player");
  }

  // "유튜브에서 열기" 링크를 현재 재생 대상에 맞춰 갱신
  function updateOpenYoutube() {
    const p = state.player;
    if (!p) return;
    $("#openYoutube").href = p.videos
      ? `https://www.youtube.com/watch?v=${p.videos[(p.index || 1) - 1] || p.videos[0]}`
      : `https://www.youtube.com/playlist?list=${p.listId}`;
  }

  // 매번 새 플레이어 생성 → 재생목록 전환 신뢰성 확보. 첫 진입은 cuePlaylist(포스터, 자동재생 X).
  function createPlayerFor(p) {
    if (!ytApiLoaded) return; // 로드되면 onYouTubeIframeAPIReady 에서 재호출
    if (ytPlayer && ytPlayer.destroy) {
      try {
        ytPlayer.destroy();
      } catch (e) {}
      ytPlayer = null;
    }
    $("#playerSlot").innerHTML = '<div id="ytmount"></div>';
    ytPlayer = new YT.Player("ytmount", {
      width: "100%",
      height: "100%",
      playerVars: { rel: 0, modestbranding: 1, playsinline: 1, origin: location.origin },
      events: {
        onReady: () => {
          const i = (p.index || 1) - 1;
          if (p.videos) ytPlayer.cuePlaylist(p.videos, i);
          else ytPlayer.cuePlaylist({ listType: "playlist", list: p.listId, index: i });
        },
      },
    });
  }

  // 칩 클릭: 같은 재생목록 안에서 특정 화로 이동(자동재생). loadPlaylist 는 전환이 확실히 됨.
  function setEpisode(index) {
    const p = state.player;
    if (!p || !ytPlayer || !ytPlayer.loadPlaylist) return;
    p.index = index;
    $("#playerTitle").textContent = p.baseTitle + (index > 1 ? ` · ${index}화` : "");
    if (p.videos) ytPlayer.loadPlaylist(p.videos, index - 1);
    else ytPlayer.loadPlaylist({ listType: "playlist", list: p.listId, index: index - 1 });
    updateOpenYoutube();
  }

  // 에피소드 번호 칩 (epCount 있는 시즌만)
  function renderEpisodeStrip(season, currentIndex) {
    const wrap = $("#epStrip");
    const n = season.epCount || (season.videos && season.videos.length);
    if (!n) {
      wrap.innerHTML = "";
      wrap.classList.add("hidden");
      return;
    }
    wrap.classList.remove("hidden");
    let chips = "";
    for (let i = 1; i <= n; i++) {
      chips +=
        `<button type="button" class="ep-chip${i === currentIndex ? " ep-chip--active" : ""}" data-ep="${i}">${i}</button>`;
    }
    wrap.innerHTML =
      `<div class="ep-strip-label">▶ 에피소드 골라 보기 <span class="ep-strip-cur">현재 ${currentIndex}화 · 총 ${n}화</span></div>` +
      `<div class="ep-chip-grid">${chips}</div>`;
    const active = wrap.querySelector(".ep-chip--active");
    if (active) active.scrollIntoView({ block: "nearest", inline: "center" });
  }

  function closePlayer() {
    // 재생 중지 (플레이어 인스턴스는 재사용)
    if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
  }

  /* ---------------------------------------------------------------- 이벤트 위임 */
  document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === "home") {
      show("home");
    } else if (action === "back-to-detail") {
      closePlayer();
      show("detail");
    }
  });

  /* 에피소드 칩 클릭 → 해당 화부터 재생 */
  $("#epStrip").addEventListener("click", (e) => {
    const chip = e.target.closest(".ep-chip");
    if (!chip) return;
    const p = state.player;
    if (!p) return;
    const i = parseInt(chip.dataset.ep, 10);
    if (!i || i === p.index) return;
    setEpisode(i);
    renderEpisodeStrip(p.season, i);
  });

  /* ---------------------------------------------------------------- 시작 */
  renderHome();
  show("home");
})();

</script>
</body>
</html>
