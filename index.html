  <style>
/* =========================================================================
 *  아기랑 – 스타일 (모바일 우선 · 큰 터치 영역 · 아기자기한 파스텔)
 * ========================================================================= */
:root {
  --bg: #fff4e6;
  --bg2: #ffe8cc;
  --ink: #4a3b2f;
  --ink-soft: #8a7663;
  --card: #ffffff;
  --shadow: 0 8px 22px rgba(120, 90, 60, 0.14);
  --radius: 22px;
  --font-round: "Jua", "Noto Sans KR", sans-serif;
  --font-body: "Noto Sans KR", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(1200px 500px at 50% -10%, #fff 0%, transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  background-attachment: fixed;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
  -webkit-tap-highlight-color: transparent;
}

/* ---------------------------------------------------------------- 헤더 */
.app-header {
  text-align: center;
  padding: 22px 16px 10px;
}
.logo {
  font-family: var(--font-round);
  font-size: 2rem;
  margin: 0;
  color: var(--ink);
  letter-spacing: 0.5px;
}
.subtitle {
  margin: 6px 0 0;
  color: var(--ink-soft);
  font-size: 0.95rem;
}

/* ---------------------------------------------------------------- 뷰 공통 */
.view { max-width: 900px; margin: 0 auto; padding: 8px 16px 40px; }
.hidden { display: none !important; }

.home-hint {
  font-family: var(--font-round);
  text-align: center;
  font-size: 1.1rem;
  margin: 6px 0 18px;
  color: var(--ink);
}

/* ---------------------------------------------------------------- 홈 그리드 */
.show-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
@media (min-width: 620px) {
  .show-grid { grid-template-columns: repeat(3, 1fr); }
}

.show-card {
  --card-color: #ff8fab;
  position: relative;
  border: none;
  cursor: pointer;
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px 14px 16px;
  box-shadow: var(--shadow);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  overflow: hidden;
  transition: transform 0.14s ease, box-shadow 0.14s ease;
  font-family: var(--font-body);
}
.show-card::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 8px;
  background: var(--card-color);
}
.show-card:active { transform: scale(0.96); }
.show-card:hover { box-shadow: 0 12px 28px rgba(120, 90, 60, 0.22); }

.show-emoji {
  font-size: 3rem;
  line-height: 1;
  margin-top: 6px;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,0.12));
}
.show-name {
  font-family: var(--font-round);
  font-size: 1.25rem;
  color: var(--ink);
  margin-top: 6px;
}
.show-sub { font-size: 0.78rem; color: var(--ink-soft); }
.show-tagline {
  font-size: 0.8rem;
  color: var(--ink-soft);
  margin-top: 4px;
  min-height: 2.2em;
  line-height: 1.35;
}
.show-badges { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
.badge {
  font-size: 0.68rem;
  background: var(--bg2);
  color: var(--ink);
  border-radius: 999px;
  padding: 2px 9px;
  font-weight: 700;
}

.disclaimer {
  margin-top: 26px;
  font-size: 0.75rem;
  color: var(--ink-soft);
  text-align: center;
  line-height: 1.6;
  background: rgba(255,255,255,0.55);
  border-radius: 16px;
  padding: 12px 14px;
}

/* ---------------------------------------------------------------- 상세 */
.detail-top { margin-bottom: 16px; }
.back-btn {
  border: none;
  background: #fff;
  color: var(--ink);
  font-family: var(--font-round);
  font-size: 1rem;
  padding: 8px 16px;
  border-radius: 999px;
  box-shadow: var(--shadow);
  cursor: pointer;
}
.back-btn:active { transform: scale(0.95); }

.detail-title {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 16px 0 12px;
}
.detail-emoji { font-size: 3rem; line-height: 1; }
.detail-title h2 { font-family: var(--font-round); margin: 0; font-size: 1.5rem; }
.detail-tagline { margin: 2px 0 0; color: var(--ink-soft); font-size: 0.9rem; }

.lang-toggle { display: inline-flex; gap: 8px; margin-top: 4px; }
.lang-btn {
  border: 2px solid var(--bg2);
  background: #fff;
  color: var(--ink-soft);
  font-family: var(--font-round);
  font-size: 0.95rem;
  padding: 8px 18px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.12s ease;
}
.lang-btn.active {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}

/* ---------------------------------------------------------------- 시즌 목록 */
.season-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.season-row {
  --card-color: #ff8fab;
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  border: none;
  cursor: pointer;
  background: var(--card);
  border-radius: 18px;
  padding: 16px 18px;
  box-shadow: var(--shadow);
  text-align: left;
  transition: transform 0.12s ease;
}
.season-row:active { transform: scale(0.98); }
.season-play {
  flex: none;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: var(--card-color);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 1.2rem;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}
.season-play--ext { background: #cbb9a6; }
.season-text { display: flex; flex-direction: column; }
.season-title { font-family: var(--font-round); font-size: 1.15rem; color: var(--ink); }
.season-note { font-size: 0.78rem; color: var(--ink-soft); margin-top: 2px; }
.season-row--fallback { opacity: 0.96; }

/* ---------------------------------------------------------------- 플레이어 */
.player-top {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.player-title {
  font-family: var(--font-round);
  font-size: 1.1rem;
  margin: 0;
  flex: 1 1 auto;
  min-width: 40%;
}
.yt-link {
  font-size: 0.85rem;
  color: #c1121f;
  text-decoration: none;
  font-weight: 700;
  background: #fff;
  padding: 8px 14px;
  border-radius: 999px;
  box-shadow: var(--shadow);
  white-space: nowrap;
}
.player-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.player-slot, .player-slot iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
.player-note {
  text-align: center;
  color: var(--ink-soft);
  font-size: 0.8rem;
  margin-top: 12px;
}

/* ---------------------------------------------------------------- 푸터 */
.app-footer {
  text-align: center;
  color: var(--ink-soft);
  font-size: 0.8rem;
  padding: 20px 16px 30px;
}
.app-footer span { font-family: var(--font-round); }
.editor-link {
  display: inline-block;
  margin-top: 8px;
  color: var(--ink-soft);
  text-decoration: none;
  border-bottom: 1px dashed var(--ink-soft);
  padding-bottom: 1px;
}

</style>
</head>

  <script>
/* =========================================================================
 *  아기랑 – 아기 미디어 앱 로직
 *  홈(프로그램) → 상세(시즌) → 플레이어(공식 재생목록 임베드)
 * ========================================================================= */
(function () {
  "use strict";

  const $ = (sel) => document.querySelector(sel);

  const views = {
    home: $("#home"),
    detail: $("#showDetail"),
    player: $("#player"),
  };

  // 현재 상태
  const state = {
    show: null, // 선택한 프로그램
    lang: "ko", // 현재 언어
  };

  const langLabel = { ko: "한국어", en: "English" };

  /* ---------------------------------------------------------------- 화면 전환 */
  function show(viewName) {
    Object.values(views).forEach((v) => v.classList.add("hidden"));
    views[viewName].classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }

  /* ---------------------------------------------------------------- 유틸 */
  // 특정 언어로 볼 수 있는지 (채널이 있으면 가능)
  function hasLang(showObj, lang) {
    return showObj.langs.includes(lang) && !!showObj.channels[lang];
  }

  // 프로그램의 기본 언어(한국어 우선, 없으면 첫 지원 언어)
  function defaultLang(showObj) {
    return showObj.langs.includes("ko") ? "ko" : showObj.langs[0];
  }

  // 유튜브 검색 URL (재생목록 ID가 없을 때의 안전한 대체 링크)
  function youtubeSearch(showObj, season, lang) {
    const name = showObj.title[lang] || showObj.title.en || showObj.title.ko;
    const seasonWord = lang === "ko" ? "전체 에피소드" : "full episodes";
    const q = `${name} ${season.title[lang] || ""} ${seasonWord}`.trim();
    return "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
  }

  /* ---------------------------------------------------------------- 홈 렌더 */
  function renderHome() {
    const grid = $("#showGrid");
    grid.innerHTML = "";

    SHOWS.forEach((s) => {
      const card = document.createElement("button");
      card.className = "show-card";
      card.style.setProperty("--card-color", s.color);
      card.setAttribute("aria-label", s.title.ko);

      const langBadges = s.langs
        .map((l) => `<span class="badge">${l === "ko" ? "한국어" : "영어"}</span>`)
        .join("");

      card.innerHTML = `
        <div class="show-emoji">${s.emoji}</div>
        <div class="show-name">${s.title.ko}</div>
        <div class="show-sub">${s.title.en}</div>
        <div class="show-tagline">${s.tagline.ko}</div>
        <div class="show-badges">${langBadges}</div>
      `;
      card.addEventListener("click", () => openShow(s));
      grid.appendChild(card);
    });
  }

  /* ---------------------------------------------------------------- 상세 렌더 */
  function openShow(showObj) {
    state.show = showObj;
    state.lang = defaultLang(showObj);
    renderDetail();
    show("detail");
  }

  function renderDetail() {
    const s = state.show;
    $("#detailEmoji").textContent = s.emoji;
    $("#detailTitle").textContent = `${s.title.ko} · ${s.title.en}`;
    $("#detailTagline").textContent = s.tagline.ko;

    // 언어 토글 (지원 언어가 2개 이상일 때만)
    const toggle = $("#langToggle");
    toggle.innerHTML = "";
    if (s.langs.length > 1) {
      s.langs.forEach((l) => {
        const btn = document.createElement("button");
        btn.className = "lang-btn" + (l === state.lang ? " active" : "");
        btn.textContent = langLabel[l];
        btn.addEventListener("click", () => {
          state.lang = l;
          renderDetail();
        });
        toggle.appendChild(btn);
      });
    }

    renderSeasons();
  }

  function renderSeasons() {
    const s = state.show;
    const lang = state.lang;
    const listEl = $("#seasonList");
    listEl.innerHTML = "";

    s.seasons.forEach((season) => {
      const hasList = !!(season.list && season.list[lang]);
      const row = document.createElement("button");
      row.className = "season-row" + (hasList ? "" : " season-row--fallback");
      row.style.setProperty("--card-color", s.color);

      const label = hasList
        ? `<span class="season-play">▶</span>`
        : `<span class="season-play season-play--ext">↗</span>`;

      const note = hasList
        ? `<span class="season-note">앱에서 순서대로 재생</span>`
        : `<span class="season-note">유튜브 공식 채널에서 보기</span>`;

      row.innerHTML = `
        ${label}
        <span class="season-text">
          <span class="season-title">${season.title[lang] || season.title.ko}</span>
          ${note}
        </span>
      `;

      row.addEventListener("click", () => {
        if (hasList) {
          openPlayer(season);
        } else {
          // 재생목록 ID가 없으면 공식 채널 또는 검색으로 이동
          const url = s.channels[lang] || youtubeSearch(s, season, lang);
          window.open(url, "_blank", "noopener");
        }
      });
      listEl.appendChild(row);
    });
  }

  /* ---------------------------------------------------------------- 플레이어 */
  function openPlayer(season) {
    const s = state.show;
    const lang = state.lang;
    const listId = season.list[lang];

    $("#playerTitle").textContent =
      `${s.title[lang] || s.title.ko} – ${season.title[lang] || season.title.ko}`;

    const slot = $("#playerSlot");
    slot.innerHTML = "";
    const iframe = document.createElement("iframe");
    iframe.src =
      `https://www.youtube-nocookie.com/embed/videoseries?list=${listId}&rel=0&modestbranding=1`;
    iframe.title = $("#playerTitle").textContent;
    iframe.allow =
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
    iframe.allowFullscreen = true;
    iframe.setAttribute("loading", "lazy");
    slot.appendChild(iframe);

    $("#openYoutube").href = `https://www.youtube.com/playlist?list=${listId}`;

    show("player");
  }

  function closePlayer() {
    // iframe 제거로 재생 중지
    $("#playerSlot").innerHTML = "";
  }

  /* ---------------------------------------------------------------- 이벤트 위임 */
  document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === "home") {
      show("home");
    } else if (action === "back-to-detail") {
      closePlayer();
      show("detail");
    }
  });

  /* ---------------------------------------------------------------- 시작 */
  renderHome();
  show("home");
})();

</script>
